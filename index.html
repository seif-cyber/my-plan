<style>
:root{
  --bg:#f1f4f9; --card:#ffffff; --card2:#f6f8fc; --text:#0f172a; --muted:#64748b; --line:#e4e9f1;
  --brand:#4f46e5; --brand2:#0ea5e9; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px -8px rgba(15,23,42,.12);
  --ico-s:80%; --ico-l:92%;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1e; --card:#141a2d; --card2:#1a2137; --text:#e9edf6; --muted:#97a3bc; --line:#242c45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
    --ico-s:45%; --ico-l:24%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1e; --card:#141a2d; --card2:#1a2137; --text:#e9edf6; --muted:#97a3bc; --line:#242c45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
  --ico-s:45%; --ico-l:24%; color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.top{
  background:linear-gradient(135deg,#4338ca 0%,#4f46e5 45%,#0ea5e9 130%);
  color:#fff;padding:calc(var(--safe-t) + 16px) 18px 54px;border-radius:0 0 28px 28px;
}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.85}
.pill{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
main{padding:0 14px calc(92px + var(--safe-b));margin-top:-38px}
.view{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 small{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:16px 6px 8px;letter-spacing:.3px}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));
}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand)}
:root[data-theme="dark"] .tabbar button.on{color:#8b93ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button.on{color:#8b93ff}}

/* ---------- day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dchip{
  flex:1 0 58px;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);position:relative
}
.dchip b{font-size:12.5px}
.dchip span{font-size:17px;font-weight:800;line-height:1.2}
.dchip i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.dchip i.p{background:var(--warn)} .dchip i.g{background:var(--ok)}
.dchip.on{background:var(--brand);color:#fff;border-color:transparent}
.dchip.today:not(.on){border-color:var(--brand)}
.dchip.on i.p,.dchip.on i.g{box-shadow:0 0 0 1.5px #fff}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:14px}
.ring{width:92px;height:92px;flex:none}
.ring .rt{fill:none;stroke:var(--line);stroke-width:8}
.ring .rf{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .rtx{font-size:17px;font-weight:800;fill:var(--text)}
.prog .meta{flex:1;min-width:0}
.prog .meta b{font-size:17px;display:block}
.prog .meta small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

/* ---------- now card ---------- */
.now{background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;border:0}
.now .lbl{font-size:12px;opacity:.85;font-weight:700}
.now .big{font-size:19px;font-weight:800;margin:2px 0}
.now .sub{font-size:13px;opacity:.92}
.bar{height:7px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.now.sleepy{background:linear-gradient(135deg,#1e1b4b,#4338ca)}

/* ---------- tasks ---------- */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:12px}
.task:last-child{border-bottom:0}
.task .chk{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;
  color:transparent;font-size:15px;font-weight:900;transition:all .15s;background:var(--card)
}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .ico,.ico{
  width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:20px;
  background:hsl(var(--h) var(--ico-s) var(--ico-l))
}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14.5px;font-weight:700}
.task .tx small{color:var(--muted);font-size:12px}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.task.now{color:var(--text);border:0;background:color-mix(in srgb,var(--brand) 9%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent);padding-inline:8px;margin-block:2px}
.task .live{font-size:11px;font-weight:800;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;flex:none}
.sleeprow{display:flex;align-items:center;gap:11px;padding:11px 4px 2px}
.sleeprow .ico{background:hsl(250 45% 28%);color:#fff}
.sleeprow b{display:block;font-size:14.5px}
.sleeprow small{color:var(--muted);font-size:12px}

/* ---------- lectures ---------- */
.lect{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;position:relative;border-inline-start:4px solid var(--brand)}
.lect.now{color:var(--text);box-shadow:0 0 0 2px var(--brand)}
.lect .tm{min-width:62px;text-align:center;font-size:12px;font-weight:800;color:var(--brand)}
.lect .tm small{display:block;color:var(--muted);font-weight:600}
.lect h3{margin:0;font-size:14.5px;font-weight:800;direction:ltr;text-align:right}
.lect p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);margin-inline-start:6px;vertical-align:2px;direction:rtl;display:inline-block}
.badge.sec2{background:color-mix(in srgb,var(--ok) 16%,transparent);color:#059669}
.badge.re{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#b45309}
.offcard{text-align:center;padding:22px 14px}
.offcard .big{font-size:42px}
.offcard p{margin:6px 0 0;color:var(--muted)}

/* ---------- stats ---------- */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-size:12px;font-weight:700}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.5}
.chart text{font-size:10.5px;fill:var(--muted);text-anchor:middle;font-family:inherit}
.chart text.v{font-weight:700;fill:var(--text)}
.chart .bg{fill:var(--line)}
.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);display:block;min-width:0}
.heat i.l1{background:#c7d2fe} .heat i.l2{background:#818cf8} .heat i.l3{background:#4f46e5} .heat i.l4{background:#10b981}
.heat i.x{opacity:0} .heat i.pre{opacity:.35}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0}
.crow .ico{width:34px;height:34px;font-size:17px;border-radius:11px}
.crow .mid{flex:1;min-width:0}
.crow .mid .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.crow .mid .t span{color:var(--muted);font-weight:600;font-size:12px}
.track{height:8px;background:var(--line);border-radius:99px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 70% 52%)}
.ins{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ins:last-child{border-bottom:0}
.ins span:first-child{font-size:20px}

/* ---------- forms ---------- */
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=time],input[type=date],select{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;
}
.q{display:flex;gap:6px;margin:6px 0 12px}
.q button{flex:1;font-size:24px;padding:6px 0;border-radius:12px;background:var(--card2);border:2px solid transparent;filter:grayscale(.8);opacity:.7}
.q button.on{border-color:var(--brand);filter:none;opacity:1}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;text-align:center}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn+.btn{margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn+.btn{margin:0}
.hrs{font-size:34px;font-weight:800;text-align:center;margin:4px 0}
.hrs small{font-size:14px;color:var(--muted);font-weight:700}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 small{color:var(--muted)}
.x{color:var(--bad);font-weight:800;padding:6px 10px}
.steps{margin:0;padding-inline-start:20px}
.steps li{margin:6px 0}
.rule{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .e{font-size:22px}
.rule b{display:block}
.rule p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ok{color:var(--ok);font-weight:800}

/* ---------- toast ---------- */
.toast{
  position:fixed;inset-inline:0;bottom:calc(86px + var(--safe-b));display:flex;justify-content:center;z-index:50;pointer-events:none;
  opacity:0;transform:translateY(10px);transition:all .25s
}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast div{background:#0f172a;color:#fff;border-radius:14px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;max-width:90vw}
.toast button{color:#93c5fd;font-weight:800}

/* ---------- animations & motion ---------- */
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:translateY(12px) scale(.85)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(79,70,229,.55)}70%{box-shadow:0 0 0 9px rgba(79,70,229,0)}100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 2px var(--brand)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 35%,transparent)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-6deg)}75%{transform:translateY(-1px) rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes chkPop{0%{transform:scale(.3)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes burst{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 14px rgba(16,185,129,0)}}
@keyframes rowFlash{0%{background:color-mix(in srgb,var(--ok) 22%,transparent)}100%{background:transparent}}
@keyframes chkOut{0%{transform:scale(.75)}100%{transform:scale(1)}}
@keyframes tabPop{0%{transform:scale(.7) translateY(4px)}60%{transform:scale(1.18) translateY(-3px)}100%{transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fillX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.85}}
@keyframes heroIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* page enter: cards cascade in */
.view{animation:none}
.view.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.06s}
.view.enter>*:nth-child(3){animation-delay:.12s}
.view.enter>*:nth-child(4){animation-delay:.18s}
.view.enter>*:nth-child(5){animation-delay:.24s}
.view.enter>*:nth-child(6){animation-delay:.3s}
.view.enter>*:nth-child(n+7){animation-delay:.36s}
.view.enter .dchip{animation:chipIn .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.view.enter .task{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i,0) * 30ms)}
.view.enter .lect{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--i,0) * 80ms)}
.view.enter .kpi{animation:popIn .5s cubic-bezier(.3,1.3,.5,1) both}
.view.enter .kpi:nth-child(2){animation-delay:.07s}
.view.enter .kpi:nth-child(3){animation-delay:.14s}
.view.enter .kpi:nth-child(4){animation-delay:.21s}
.view.enter .chart rect:not(.bg){transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) .2s both}
.view.enter .track i{transform-origin:right;animation:fillX .9s cubic-bezier(.2,.8,.2,1) .25s both}
.view.enter .heat i{animation:fade .4s ease-out .2s both}
.view.enter .rule,.view.enter .row2,.view.enter .ins{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) .15s both}

/* header */
.top{background-size:200% 200%;animation:grad 12s ease infinite}
.top h1{animation:heroIn .6s cubic-bezier(.2,.8,.2,1) both}
.top p{animation:heroIn .6s cubic-bezier(.2,.8,.2,1) .08s both}
.top .pill{animation:popIn .6s cubic-bezier(.3,1.4,.5,1) .15s both}

/* now card */
.card.now{background-size:220% 220%;animation:grad 8s ease infinite}
.bar>i{position:relative;overflow:hidden;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(14,165,233,.55),transparent);transform:translateX(-100%);animation:shimmer 2.2s ease-in-out infinite}
.task .live{animation:livePulse 1.8s ease-out infinite}
.task.now .ico{animation:bob 2.6s ease-in-out infinite}
.lect.now{animation:ringPulse 2.2s ease-in-out infinite}
.offcard .big{display:inline-block;animation:float 3.2s ease-in-out infinite}

/* ring */
.ring .rf{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}

/* touch feedback */
.task,.dchip,.lect,.btn,.seg button,.q button,.chip,.kpi,.tabbar button{transition:transform .2s cubic-bezier(.3,1.4,.5,1),background-color .25s,color .25s,box-shadow .25s,border-color .25s}
.task:active,.dchip:active,.lect:active,.btn:active,.seg button:active,.q button:active,.tabbar button:active{transform:scale(.96)}
.task .tx b{transition:color .25s}

/* check / uncheck */
.task.pop{animation:rowFlash .8s ease-out}
.task.pop .chk{animation:chkPop .5s cubic-bezier(.3,1.6,.5,1),burst .7s ease-out}
.task.unpop .chk{animation:chkOut .3s ease-out}

/* tab bar */
.tabbar button{position:relative}
.tabbar button::after{content:"";position:absolute;top:-6px;inset-inline:0;margin:auto;width:22px;height:3px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tabbar button.on::after{transform:scaleX(1)}
.tabbar button.on svg{animation:tabPop .45s cubic-bezier(.3,1.6,.5,1)}

/* toast */
.toast{transform:translateY(26px) scale(.92);transition:opacity .3s,transform .5s cubic-bezier(.3,1.5,.5,1)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation-name:fall;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards}

/* ---------- pomodoro ---------- */
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes tick{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.pomo{position:fixed;inset:0;z-index:70;background:rgba(10,15,30,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .3s ease-out}
.pomo-card{--pc:#ef4444;width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:18px 20px calc(26px + var(--safe-b));text-align:center;position:relative;animation:sheetUp .45s cubic-bezier(.2,.9,.3,1.05);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.pomo-card.break,.pomo-card.done{--pc:var(--ok)}
.pomo-card.ready{--pc:var(--brand)}
.pomo-x{position:absolute;top:10px;inset-inline-end:12px;font-size:15px;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:10px;background:var(--card2)}
.pomo-grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.pomo-phase{display:inline-block;font-weight:800;font-size:13px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);padding:4px 14px;border-radius:99px;transition:color .4s,background .4s}
.pomo-task{font-weight:800;font-size:17px;margin:10px 0 0}
.pomo-ring{position:relative;width:min(240px,62vw);aspect-ratio:1;margin:14px auto 10px}
.pomo-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.pomo-ring .pt{fill:none;stroke:var(--line);stroke-width:12}
.pomo-ring .pf{fill:none;stroke:var(--pc);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .4s;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--pc) 45%,transparent))}
.pomo-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(40px,13vw,56px);font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;line-height:1}
.pomo-time small{font-size:13px;color:var(--muted);font-weight:700;margin-top:8px;direction:rtl}
.pomo-card.running .pomo-ring{animation:tick 4s ease-in-out infinite}
.pomo-card.paused .pomo-time b{animation:blink 1.2s steps(2) infinite}
.pomo-dots{display:flex;gap:8px;justify-content:center;margin:2px 0 16px}
.pomo-dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.pomo-dots i.on{background:var(--pc);transform:scale(1.15)}
.pomo-dots i.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 35%,transparent)}
.pomo-btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.pomo-btns.one{grid-template-columns:1fr}
.pomo-btns .btn+.btn{margin:0}
.pomo .btn:not(.sec){background:var(--pc);transition:background .4s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.pomo-stop{margin-top:14px;color:var(--bad);font-weight:700;font-size:14px;padding:6px 12px}
.pomo-mini{position:fixed;z-index:30;bottom:calc(80px + var(--safe-b));inset-inline-start:14px;display:flex;align-items:center;gap:6px;background:#ef4444;color:#fff;font-weight:800;font-size:15px;border-radius:99px;padding:9px 16px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;animation:popIn .4s cubic-bezier(.3,1.4,.5,1);transition:background .4s,transform .2s}
.pomo-mini:active{transform:scale(.95)}
.pomo-mini.break,.pomo-mini.done{background:var(--ok)}
.pomo-mini.ready{background:var(--brand)}
.pomo-mini span{direction:ltr}
.pomo-go{flex:none;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,#ef4444 13%,transparent);font-size:17px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.pomo-go:active{transform:scale(.88)}
.pomo-go.running{box-shadow:0 0 0 2px #ef4444;animation:livePulse 1.8s ease-out infinite}

@media print{
  .tabbar,.toast{display:none!important}
  body{background:#fff}
  main{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   كل البيانات بتتحفظ على جهازك (localStorage) — مفيش سيرفر.
   ============================================================ */
(() => {
'use strict';

const PLAN = window.PLAN, CATS = window.CATS, RULES = window.RULES || [];
const LS_KEY = 'saif-plan-v1';
const VERSION = '1.0.0';
const PASS = 0.7;                       // اليوم "ناجح" لو الإنجاز >= 70%

/* ---------- helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => dkey(new Date());
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const fmt = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'م' : 'ص'; h = h % 12 || 12; return `${pad(h)}:${pad(m)} ${ap}`; };
const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h} س ${r} د` : h ? `${h} س` : `${r} د`; };
const hrs = m => (m / 60).toFixed(1).replace(/\.0$/, '');
const pct = x => Math.round(x * 100);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const weekStart = d => addDays(d, -d.getDay());                 // الأسبوع بيبدأ الأحد
const itemKey = it => `${it.s}|${it.c}`;
const dayPlan = date => PLAN.days[date.getDay()];

function greeting() { return `${new Date().getHours() < 12 ? 'صباح الخير' : 'مساء الخير'} يا باشمهندس ${PLAN.owner} 👋`; }

function longDate(d) {
  try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(d); }
  catch (e) { return dkey(d); }
}
function shortDM(d) {
  try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }).format(d); }
  catch (e) { return `${d.getDate()}/${d.getMonth() + 1}`; }
}

/* ---------- state ---------- */
function defaults() {
  return { v: 1, start: todayKey(), done: {}, sleep: {}, settings: { theme: 'auto', remind: 10 }, pomos: {}, timer: null };
}
let S = (() => {
  let s = defaults();
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const p = JSON.parse(raw); s = Object.assign(s, p); }
  } catch (e) { /* ignore */ }
  s.settings = Object.assign({ theme: 'auto', remind: 10 }, s.settings || {});
  s.done = s.done || {}; s.sleep = s.sleep || {}; s.pomos = s.pomos || {}; s.timer = s.timer || null;
  return s;
})();
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; }
  catch (e) { toast('⚠️ تعذّر الحفظ على الجهاز'); return false; }
}
save();

const ui = { tab: 'today', day: todayKey(), range: 7, lastToday: todayKey() };

/* ---------- toast ---------- */
let toastT;
function toast(msg, btn) {
  const el = $('#toast'), b = $('#toastBtn');
  $('#toastMsg').textContent = msg;
  if (btn) { b.hidden = false; b.textContent = btn.label; b.onclick = () => { btn.fn(); el.classList.remove('show'); }; }
  else { b.hidden = true; b.onclick = null; }
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), btn ? 9000 : 2400);
}

/* ---------- core calculations ---------- */
function dayStats(date) {
  const dp = dayPlan(date), dn = S.done[dkey(date)] || {};
  let done = 0, planMin = 0, doneMin = 0;
  for (const it of dp.routine) {
    const m = mins(it.e) - mins(it.s);
    planMin += m;
    if (dn[itemKey(it)]) { done++; doneMin += m; }
  }
  const total = dp.routine.length;
  return { total, done, p: total ? done / total : 0, planMin, doneMin };
}
const isCounted = k => k >= S.start && k <= todayKey();

function streaks() {
  const t = new Date(); let cur = 0, best = 0, run = 0;
  // best: scan from start to today
  for (let d = parseKey(S.start); dkey(d) <= todayKey(); d = addDays(d, 1)) {
    if (dayStats(d).p >= PASS) { run++; best = Math.max(best, run); } else run = 0;
  }
  // current: backwards from today (today may still be in progress)
  for (let i = 0, d = t; ; i++, d = addDays(t, -i)) {
    const k = dkey(d); if (k < S.start) break;
    if (dayStats(d).p >= PASS) cur++;
    else if (i === 0) continue;
    else break;
  }
  return { cur, best };
}

function rangeDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(new Date(), -i));
  return out;
}

/* ---------- SVG helpers ---------- */
function ring(p) {
  const r = 34, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 80 80" role="img" aria-label="${pct(p)}%">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
    <circle cx="40" cy="40" r="${r}" class="rt"/>
    <circle cx="40" cy="40" r="${r}" class="rf" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p)).toFixed(2)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="45" text-anchor="middle" class="rtx">${pct(p)}%</text></svg>`;
}

/* vals: 0..1 | null  —  الأقدم على اليمين (RTL) */
function barChart(vals, o) {
  const n = vals.length, W = 320, H = o.h || 150, pt = o.vl ? 16 : 8, pb = o.labels ? 22 : 8, ph = H - pt - pb;
  const gap = n > 14 ? 2 : 8, bw = (W - gap * (n + 1)) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.aria || 'رسم بياني')}">`;
  if (o.line != null) { const y = pt + ph * (1 - o.line); s += `<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/>`; }
  vals.forEach((v, i) => {
    const x = W - (i + 1) * bw - (i + 1) * gap;
    const full = ph, vv = v == null ? 0 : Math.min(1, Math.max(0, v));
    const bh = Math.max(v == null ? 0 : 3, full * vv);
    const col = v == null ? 'transparent' : (o.color ? o.color(vv) : '#4f46e5');
    s += `<rect x="${x.toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${full}" rx="${Math.min(6, bw / 2).toFixed(1)}" class="bg" opacity=".45"/>`;
    if (v != null) s += `<rect x="${x.toFixed(1)}" y="${(pt + full - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}" fill="${col}"/>`;
    if (o.vl && o.vl[i] != null) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(pt + full - bh - 4).toFixed(1)}" class="v">${esc(o.vl[i])}</text>`;
    if (o.labels && o.labels[i]) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}">${esc(o.labels[i])}</text>`;
  });
  return s + '</svg>';
}

/* ============================================================
   TODAY
   ============================================================ */
function currentBlock(dp) {
  const m = nowMin();
  const cur = dp.routine.find(it => mins(it.s) <= m && m < mins(it.e));
  const next = dp.routine.find(it => mins(it.s) > m);
  return { cur, next, m };
}

function renderToday() {
  const k = ui.day, date = parseKey(k), dp = dayPlan(date), tk = todayKey();
  const isToday = k === tk, future = k > tk;
  const dn = S.done[k] || {}, st = dayStats(date), sk = streaks();
  const ws = weekStart(new Date());

  /* day strip */
  let strip = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), dk = dkey(d), s = dayStats(d);
    const dot = dk > tk ? '' : s.p >= PASS ? 'g' : s.done ? 'p' : '';
    strip += `<button class="dchip ${dk === k ? 'on' : ''} ${dk === tk ? 'today' : ''}" data-act="day" data-day="${dk}" style="--i:${i}" aria-label="${PLAN.days[i].name}">
      <b>${PLAN.days[i].name}</b><span>${d.getDate()}</span><i class="${dot}"></i></button>`;
  }

  /* now card */
  let nowHtml = '';
  if (isToday) {
    const { cur, next, m } = currentBlock(dp);
    const bed = mins(PLAN.sleep.bed), first = dp.routine[0];
    if (cur) {
      const c = CATS[cur.c], total = mins(cur.e) - mins(cur.s), left = mins(cur.e) - m;
      nowHtml = `<div class="card now"><div class="lbl">دلوقتي</div>
        <div class="big">${c.i} <bdi>${esc(cur.t)}</bdi></div>
        <div class="sub">${fmt(cur.s)} – ${fmt(cur.e)} · باقي ${dur(left)}${next ? ` · بعده: ${esc(next.t)}` : ''}</div>
        <div class="bar"><i style="width:${Math.min(100, pct((total - left) / total))}%"></i></div></div>`;
    } else if (m >= bed || m < mins(PLAN.sleep.wake)) {
      nowHtml = `<div class="card now sleepy"><div class="lbl">وقت النوم</div><div class="big">🌙 نام يا بطل</div>
        <div class="sub">الصحيان ${fmt(PLAN.sleep.wake)} — النوم هو اللي بيشغّل بكرة.</div></div>`;
    } else if (next) {
      nowHtml = `<div class="card now"><div class="lbl">الجاي</div><div class="big">${CATS[next.c].i} ${esc(next.t)}</div>
        <div class="sub">الساعة ${fmt(next.s)} · بعد ${dur(mins(next.s) - m)}</div></div>`;
    }
    if (m >= bed - 60 && m < bed && cur) nowHtml += `<div class="card" style="text-align:center">🌙 فاضل أقل من ساعة على النوم — قلّل الشاشة.</div>`;
  } else if (future) {
    nowHtml = `<div class="card" style="text-align:center">⏳ اليوم ده لسه مجاش — دي معاينة للجدول.</div>`;
  }

  /* lectures */
  let lect = '';
  if (dp.lectures.length) {
    const m = nowMin();
    lect = `<div class="card"><h2>🏛️ جدول الجامعة <small>${dp.lectures.length} محاضرات</small></h2>` +
      dp.lectures.map((l, li) => {
        const live = isToday && mins(l.s) <= m && m < mins(l.e);
        const bcls = l.k === 'سكشن' ? 'sec2' : l.k === 'إعادة' ? 're' : '';
        return `<div class="lect ${live ? 'now' : ''}" style="--i:${li}">
          <div class="tm">${fmt(l.s)}<small>${fmt(l.e)}</small></div>
          <div><h3>${esc(l.t)}<span class="badge ${bcls}">${esc(l.k)}</span></h3>
          <p>👤 ${esc(l.who)} · 📍 ${esc(l.room)}</p></div></div>`;
      }).join('') + '</div>';
  } else {
    lect = `<div class="card offcard"><div class="big">${dp.id === 'fri' ? '🕌' : dp.id === 'sat' ? '🔥' : '😎'}</div>
      <b>${esc(dp.tag)}</b><p>${esc(dp.offMsg || 'مفيش محاضرات النهارده.')}</p></div>`;
  }

  /* routine */
  const m = nowMin();
  const tasks = dp.routine.map((it, ti) => {
    const c = CATS[it.c], key = itemKey(it), done = !!dn[key];
    const live = isToday && mins(it.s) <= m && m < mins(it.e);
    return `<li class="task ${done ? 'done' : ''} ${live ? 'now' : ''}" data-act="toggle" data-key="${esc(key)}" role="checkbox" aria-checked="${done}" style="--i:${ti}">
      <span class="chk">✓</span><span class="ico" style="--h:${c.h}">${c.i}</span>
      <div class="tx"><b><bdi>${esc(it.t)}</bdi></b><small>${fmt(it.s)} – ${fmt(it.e)} · ${dur(mins(it.e) - mins(it.s))}</small></div>
      ${live ? '<span class="live">دلوقتي</span>' : ''}${isToday && !done && pomoOK(it) ? `<button class="pomo-go ${S.timer && S.timer.key === key ? 'running' : ''}" data-act="pomoStart" data-key="${esc(key)}" aria-label="ابدأ بومودورو">🍅</button>` : ''}</li>`;
  }).join('');
  const sleepH = ((24 * 60 - mins(PLAN.sleep.bed) + mins(PLAN.sleep.wake)) / 60);

  $('#v-today').innerHTML = `
    <div class="strip" id="strip">${strip}</div>
    <div class="card"><div class="prog">${ring(st.p)}
      <div class="meta"><b>${esc(dp.name)} — ${esc(dp.tag)}</b>
        <small>${st.done} من ${st.total} مهام · ${hrs(st.doneMin)} من ${hrs(st.planMin)} ساعة</small>
        <div class="chips"><span class="chip">🔥 سلسلة ${sk.cur}</span><span class="chip">🏆 أفضل ${sk.best}</span>${pomoCount(k) ? `<span class="chip">🍅 ${pomoCount(k)} بومودورو</span>` : ''}
        ${st.p >= PASS ? '<span class="chip" style="color:var(--ok)">✅ يوم ناجح</span>' : `<span class="chip">🎯 الهدف ${pct(PASS)}%</span>`}</div></div></div></div>
    ${nowHtml}${lect}
    <div class="card"><h2>✅ روتين اليوم <small>اضغط على المهمة لتحديدها</small></h2>
      <ul class="tasks">${tasks}</ul>
      <div class="sleeprow"><span class="ico">🌙</span><div><b>نوم ثابت — ${fmt(PLAN.sleep.bed)}</b>
        <small>صحيان ${fmt(PLAN.sleep.wake)} · ${sleepH} ساعة نوم</small></div></div></div>`;

  $('#hello').textContent = greeting();
  $('#subdate').textContent = `${longDate(date)} · ${PLAN.term}`;
  $('#streakPill').textContent = `🔥 ${sk.cur}`;
  animateRing();
  const on = $('#strip .on'); if (on && !renderToday.scrolled) { on.scrollIntoView({ inline: 'center', block: 'nearest' }); renderToday.scrolled = true; }
}

function toggle(key) {
  const k = ui.day;
  if (k > todayKey()) return toast('⏳ اليوم ده لسه مجاش');
  S.done[k] = S.done[k] || {};
  if (S.done[k][key]) delete S.done[k][key]; else S.done[k][key] = 1;
  if (!Object.keys(S.done[k]).length) delete S.done[k];
  save();
  const was = navigator.vibrate ? navigator.vibrate(8) : 0;
  renderToday();
  const row = document.querySelector(`.task[data-key="${CSS.escape(key)}"]`);
  if (row) row.classList.add(S.done[k] && S.done[k][key] ? 'pop' : 'unpop');
  if (dayStats(parseKey(k)).p === 1) { toast('🎉 خلّصت كل مهام اليوم! ما شاء الله'); confetti(); }
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats() {
  const n = ui.range, days = rangeDays(n), tk = todayKey();
  const counted = days.filter(d => isCounted(dkey(d)));
  const stats = days.map(d => isCounted(dkey(d)) ? dayStats(d) : null);
  const avg = counted.length ? counted.reduce((a, d) => a + dayStats(d).p, 0) / counted.length : 0;
  const tasks = counted.reduce((a, d) => a + dayStats(d).done, 0);
  const doneMin = counted.reduce((a, d) => a + dayStats(d).doneMin, 0);
  const good = counted.filter(d => dayStats(d).p >= PASS).length;
  const sk = streaks();

  /* chart */
  const labels = n <= 7 ? days.map(d => PLAN.days[d.getDay()].name.replace('ال', '')) : days.map((d, i) => (i % 5 === 0 || i === n - 1) ? d.getDate() : '');
  const vl = n <= 7 ? stats.map(s => s ? pct(s.p) + '%' : null) : null;
  const chart = barChart(stats.map(s => s ? s.p : null), {
    line: PASS, labels, vl, aria: 'نسبة الإنجاز اليومي',
    color: v => v >= PASS ? '#10b981' : v >= 0.4 ? '#f59e0b' : '#ef4444'
  });

  /* heatmap: 12 أسبوع */
  const hs = addDays(weekStart(new Date()), -11 * 7);
  let heat = '';
  for (let i = 0; i < 84; i++) {
    const d = addDays(hs, i), k = dkey(d);
    if (k > tk) { heat += '<i class="x"></i>'; continue; }
    if (k < S.start) { heat += '<i class="pre"></i>'; continue; }
    const p = dayStats(d).p, l = p === 0 ? '' : p < .4 ? 'l1' : p < PASS ? 'l2' : p < 1 ? 'l3' : 'l4';
    heat += `<i class="${l}" title="${k} · ${pct(p)}%"></i>`;
  }

  /* categories */
  const agg = {};
  for (const d of counted) {
    const dp = dayPlan(d), dn = S.done[dkey(d)] || {};
    for (const it of dp.routine) {
      const m = mins(it.e) - mins(it.s), a = agg[it.c] = agg[it.c] || { plan: 0, done: 0 };
      a.plan += m; if (dn[itemKey(it)]) a.done += m;
    }
  }
  const cats = Object.entries(agg).sort((a, b) => b[1].plan - a[1].plan);
  const catHtml = cats.length ? cats.map(([c, a]) => {
    const r = a.plan ? a.done / a.plan : 0, ci = CATS[c];
    return `<div class="crow"><span class="ico" style="--h:${ci.h}">${ci.i}</span>
      <div class="mid"><div class="t">${esc(ci.n)}<span>${hrs(a.done)} / ${hrs(a.plan)} س · ${pct(r)}%</span></div>
      <div class="track" style="--h:${ci.h}"><i style="width:${pct(r)}%"></i></div></div></div>`;
  }).join('') : '<p class="muted">لسه مفيش بيانات — ابدأ علّم مهامك وهتظهر هنا.</p>';

  /* insights */
  const ins = [];
  const all = []; for (let d = parseKey(S.start); dkey(d) <= tk; d = addDays(d, 1)) all.push(d);
  if (all.length >= 3) {
    const wd = Array.from({ length: 7 }, () => ({ s: 0, c: 0 }));
    all.forEach(d => { const w = wd[d.getDay()]; w.s += dayStats(d).p; w.c++; });
    const ranked = wd.map((w, i) => ({ i, a: w.c ? w.s / w.c : null })).filter(x => x.a != null).sort((a, b) => b.a - a.a);
    if (ranked.length >= 2) {
      ins.push(['📈', `أفضل يوم عندك: <b>${PLAN.days[ranked[0].i].name}</b> (${pct(ranked[0].a)}%)`]);
      const w = ranked[ranked.length - 1];
      if (w.a < ranked[0].a) ins.push(['🧭', `أضعف يوم: <b>${PLAN.days[w.i].name}</b> (${pct(w.a)}%) — جرّب تخفف حمله.`]);
    }
  }
  const rated = cats.filter(([, a]) => a.plan >= 60).map(([c, a]) => [c, a.done / a.plan]).sort((a, b) => b[1] - a[1]);
  if (rated.length >= 2 && counted.length >= 2) {
    ins.push(['💪', `أكتر حاجة ملتزم بيها: <b>${esc(CATS[rated[0][0]].n)}</b> (${pct(rated[0][1])}%)`]);
    const w = rated[rated.length - 1];
    if (w[1] < .7) ins.push(['🎯', `محتاج انتباه: <b>${esc(CATS[w[0]].n)}</b> (${pct(w[1])}%)`]);
  }
  if (!ins.length) ins.push(['🌱', 'كمّل علّم مهامك كام يوم وهتظهرلك ملاحظات مخصصة هنا.']);

  $('#v-stats').innerHTML = `
    <div class="card"><div class="seg">
      <button data-act="range" data-n="7" class="${n === 7 ? 'on' : ''}">آخر 7 أيام</button>
      <button data-act="range" data-n="30" class="${n === 30 ? 'on' : ''}">آخر 30 يوم</button>
    </div></div>
    <div class="kpis">
      <div class="kpi"><small>متوسط الإنجاز</small><b>${pct(avg)}%</b><em>${counted.length} يوم محسوب</em></div>
      <div class="kpi"><small>أيام ناجحة</small><b>${good}</b><em>من ${counted.length} · الهدف ${pct(PASS)}% فأكتر</em></div>
      <div class="kpi"><small>🔥 السلسلة الحالية</small><b>${sk.cur}</b><em>أفضل سلسلة: ${sk.best}</em></div>
      <div class="kpi"><small>ساعات منجزة</small><b>${hrs(doneMin)}</b><em>${tasks} مهمة</em></div>
    </div>
    <div class="card"><h2>📊 الإنجاز اليومي <small>الخط = ${pct(PASS)}%</small></h2>${chart}</div>
    <div class="card"><h2>🗓️ آخر 12 أسبوع</h2><div class="heat">${heat}</div>
      <div class="legend">أقل <i style="background:var(--line)"></i><i style="background:#c7d2fe"></i><i style="background:#818cf8"></i><i style="background:#4f46e5"></i><i style="background:#10b981"></i> أكتر</div></div>
    <div class="card"><h2>⏱️ الوقت حسب النشاط <small>منجز / مخطط</small></h2>${catHtml}</div>
    <div class="card"><h2>💡 ملاحظات</h2>${ins.map(([e, t]) => `<div class="ins"><span>${e}</span><span>${t}</span></div>`).join('')}</div>`;
}

/* ============================================================
   MORE
   ============================================================ */
let deferredInstall = null;
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function renderMore() {
  const th = S.settings.theme, rm = S.settings.remind;
  const install = isStandalone() ? `<div class="card"><h2>📲 التطبيق</h2><p class="ok" style="margin:0">✅ شغّال كتطبيق على الشاشة الرئيسية</p></div>` :

/* ---------- ICS (تقويم) ---------- */
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function fold(line) { let out = '', i = 0; while (line.length - i > 60) { out += line.slice(i, i + 60) + '\r\n '; i += 60; } return out + line.slice(i); }
function nextDate(idx) { const t = new Date(); let d = new Date(t.getFullYear(), t.getMonth(), t.getDate()); while (d.getDay() !== idx) d = addDays(d, 1); return d; }
function buildICS(mode) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Khotty//AR//', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:خطتي'];
  const now = new Date(), stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'], rm = S.settings.remind;
  const tm = t => t.replace(':', '') + '00';
  const ev = (uid, title, ds, s, e, idx, o = {}) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@khotty`, `DTSTAMP:${stamp}`, `DTSTART:${ds}T${tm(s)}`, `DTEND:${ds}T${tm(e)}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${BY[idx]};UNTIL=20270131T235959`, `SUMMARY:${icsEscape(title)}`);
    if (o.loc) L.push(`LOCATION:${icsEscape(o.loc)}`);
    if (o.desc) L.push(`DESCRIPTION:${icsEscape(o.desc)}`);
    for (const m of (o.alarms || [rm])) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(title)}`, `TRIGGER:-PT${m}M`, 'END:VALARM');
    L.push('END:VEVENT');
  };
  PLAN.days.forEach((d, idx) => {
    const f = nextDate(idx), ds = `${f.getFullYear()}${pad(f.getMonth() + 1)}${pad(f.getDate())}`;
    d.lectures.forEach(l => ev(`${d.id}-lec-${l.s}`, `🏛️ ${l.t} (${l.k})`, ds, l.s, l.e, idx, { loc: l.room, desc: l.who }));
    if (mode === 'all') {
      d.routine.filter(it => it.c !== 'uni').forEach(it => ev(`${d.id}-${it.s}-${it.c}`, `${CATS[it.c].i} ${it.t}`, ds, it.s, it.e, idx, { alarms: [it.c === 'quran' ? 0 : rm] }));
      const be = pad(Math.floor((mins(PLAN.sleep.bed) + 15) / 60)) + ':' + pad((mins(PLAN.sleep.bed) + 15) % 60);
      ev(`${d.id}-sleep`, `🌙 وقت النوم — صحيان ${fmt(PLAN.sleep.wake)}`, ds, PLAN.sleep.bed, be, idx, { alarms: [30, 0] });
    }
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}

async function shareOrDownload(name, mime, text) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

/* ---------- backup ---------- */
function importData(text) {
  try {
    const p = JSON.parse(text);
    if (!p || typeof p !== 'object' || !p.done) throw 0;
    S = Object.assign(defaults(), p); S.settings = Object.assign({ theme: 'auto', remind: 10 }, p.settings || {});
    save(); applyTheme(); render(); toast('✅ تم استيراد البيانات');
  } catch (e) { toast('⚠️ الملف مش صالح'); }
}

  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);

}

/* ---------- motion helpers ---------- */
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateIn(v) {
  ui.anim = false;
  if (!v || reducedMotion()) return;
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  clearTimeout(v._t); v._t = setTimeout(() => v.classList.remove('enter'), 1800);
}
function animateRing() {
  const rf = $('#v-today .rf'), tx = $('#v-today .rtx'); if (!rf || !tx) return;
  const full = parseFloat(rf.getAttribute('stroke-dasharray')), to = parseFloat(rf.getAttribute('stroke-dashoffset'));
  const last = animateRing.last; let from = null;
  if (ui.anim) from = full;
  else if (last && last.k === ui.day && last.off !== to) from = last.off;
  animateRing.last = { k: ui.day, off: to };
  if (from == null || reducedMotion()) return;
  rf.style.transition = 'none'; rf.style.strokeDashoffset = from + 'px'; rf.getBoundingClientRect();
  rf.style.transition = ''; rf.style.strokeDashoffset = to + 'px';
  const final = tx.textContent, fp = (1 - from / full) * 100, tp = (1 - to / full) * 100, t0 = performance.now(), D = 900;
  const step = t => {
    const q = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - q, 3);
    tx.textContent = q < 1 ? Math.round(fp + (tp - fp) * e) + '%' : final;
    if (q < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function confetti() {
  if (reducedMotion()) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#ec4899'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};--dx:${((Math.random() - .5) * 180).toFixed(0)}px;--r:${(Math.random() * 900 - 450).toFixed(0)}deg;animation-delay:${(Math.random() * .35).toFixed(2)}s;animation-duration:${(1.5 + Math.random() * 1.3).toFixed(2)}s`;
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3500);
}

/* ============================================================
   POMODORO  (50 دقيقة تركيز / 10 دقايق بريك)
   ============================================================ */
const FOCUS = 50 * 60e3, BREAK = 10 * 60e3, ARC = 552.92;
const pomoOK = it => ['study', 'web', 'german', 'read'].includes(it.c) && !/كورس الألماني/.test(it.t);
const pomoCycles = it => Math.max(1, Math.round((mins(it.e) - mins(it.s)) / 60));
const pomoCount = k => (S.pomos = S.pomos || {})[k] || 0;
let actx = null, wakeLock = null;

function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { /* no audio */ }
}
function beep() {
  if (!actx) return;
  try {
    const t = actx.currentTime;
    [0, .28, .56].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .24);
      o.connect(g); g.connect(actx.destination); o.start(t + d); o.stop(t + d + .26);
    });
  } catch (e) { /* ignore */ }
}
function alertUser(msg) {
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
  beep(); toast(msg);
}
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && !document.hidden) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

function pomoStart(key) {
  const it = dayPlan(new Date()).routine.find(x => itemKey(x) === key); if (!it) return;
  unlockAudio();
  if (S.timer && S.timer.key === key && S.timer.day === todayKey()) return pomoOpen();
  if (S.timer && S.timer.phase !== 'done' && !confirm('فيه بومودورو شغال لمهمة تانية. تبدأ واحدة جديدة؟')) return;
  S.timer = { day: todayKey(), key, t: it.t, cycles: pomoCycles(it), cycle: 1, phase: 'focus', endsAt: Date.now() + FOCUS, left: null };
  save(); pomoOpen(); if (ui.tab === 'today') renderToday();
}
function pomoAdvance(silent, counted = true) {
  const T = S.timer; if (!T) return;
  if (T.phase === 'focus') {
    if (counted) { S.pomos = S.pomos || {}; S.pomos[T.day] = pomoCount(T.day) + 1; }
    if (T.cycle >= T.cycles) {
      T.phase = 'done'; T.endsAt = null; T.left = null;
      S.done[T.day] = S.done[T.day] || {}; S.done[T.day][T.key] = 1;
      if (!silent) { alertUser('🎉 خلّصت البلوك كله! المهمة اتعلّمت'); confetti(); }
    } else {
      T.phase = 'break'; T.endsAt = (silent ? T.endsAt : Date.now()) + BREAK; T.left = null;
      if (!silent) alertUser('☕ برافو! خد بريك 10 دقايق');
    }
  } else if (T.phase === 'break') {
    T.phase = 'ready'; T.endsAt = null; T.left = null;
    if (!silent) alertUser('💪 البريك خلص — يلا نكمل');
  }
  save();
}
function pomoCatchUp() {
  const T = S.timer; if (!T) return false;
  if (T.day !== todayKey()) { S.timer = null; save(); return true; }
  let changed = false;
  while (S.timer && S.timer.endsAt && Date.now() >= S.timer.endsAt) { pomoAdvance(true); changed = true; }
  if (changed) {
    const p = S.timer && S.timer.phase;
    toast(p === 'break' ? '☕ وقت البريك' : p === 'ready' ? '💪 البريك خلص — يلا نكمل' : '🎉 خلّصت البلوك كله!');
    if (ui.tab === 'today') renderToday();
  }
  return changed;
}
function pomoMain() {
  const T = S.timer; if (!T) return;
  unlockAudio();
  if (T.phase === 'done') { S.timer = null; ui.pomoOpen = false; save(); if (ui.tab === 'today') renderToday(); return pomoPaint(); }
  if (T.phase === 'ready') { T.cycle++; T.phase = 'focus'; T.endsAt = Date.now() + FOCUS; T.left = null; }
  else if (T.left != null) { T.endsAt = Date.now() + T.left; T.left = null; }          // resume
  else { T.left = Math.max(0, T.endsAt - Date.now()); T.endsAt = null; }               // pause
  save(); pomoPaint();
}
function pomoSkip() {
  const T = S.timer; if (!T) return;
  if (T.phase === 'focus') pomoAdvance(false, false);
  else if (T.phase === 'break') { T.phase = 'ready'; T.endsAt = null; T.left = null; save(); }
  if (ui.tab === 'today') renderToday();
  pomoPaint();
}
function pomoStop() {
  if (!S.timer) return;
  if (S.timer.phase !== 'done' && !confirm('تنهي جلسة البومودورو؟')) return;
  S.timer = null; ui.pomoOpen = false; save(); keepAwake(false);
  if (ui.tab === 'today') renderToday();
  pomoPaint();
}
function pomoOpen() { ui.pomoOpen = true; pomoPaint(); }

function pomoPaint() {
  const T = S.timer, ov = $('#pomo'), mini = $('#pomoMini');
  if (!T) { ov.hidden = true; mini.hidden = true; document.title = pomoPaint.title || document.title; keepAwake(false); return; }
  pomoPaint.title = pomoPaint.title || document.title;
  const total = T.phase === 'break' ? BREAK : FOCUS;
  const left = T.left != null ? T.left : T.endsAt ? Math.max(0, T.endsAt - Date.now()) : (T.phase === 'ready' ? FOCUS : 0);
  const s = Math.ceil(left / 1000), mmss = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  const paused = T.left != null, running = !!T.endsAt;
  const labels = { focus: '🍅 تركيز', break: '☕ بريك', ready: '✋ مستنيك تكمل', done: '🎉 خلّصت' };
  const card = $('#pomoCard');
  card.className = `pomo-card ${T.phase} ${paused ? 'paused' : ''} ${running ? 'running' : ''}`;
  $('#pomoPhase').textContent = labels[T.phase] + (paused ? ' · متوقف' : '');
  $('#pomoTask').textContent = T.t;
  $('#pomoTime').textContent = T.phase === 'done' ? '✓' : mmss;
  $('#pomoSub').textContent = T.phase === 'done' ? `${T.cycles} بومودورو 💪` : `بومودورو ${T.cycle} من ${T.cycles}`;
  $('#pomoArc').setAttribute('stroke-dashoffset', (T.phase === 'done' ? 0 : ARC * (1 - left / total)).toFixed(2));
  $('#pomoDots').innerHTML = Array.from({ length: T.cycles }, (_, i) => {
    const doneN = T.phase === 'focus' ? T.cycle - 1 : T.cycle, cur = T.phase === 'ready' ? T.cycle : T.cycle - 1;
    return `<i class="${i < doneN ? 'on' : ''} ${i === cur && T.phase !== 'done' ? 'cur' : ''}"></i>`;
  }).join('');
  $('#pomoMain').textContent = T.phase === 'done' ? 'تمام 👌' : T.phase === 'ready' ? `▶ ابدأ بومودورو ${T.cycle + 1}` : paused ? '▶ كمّل' : '⏸ إيقاف مؤقت';
  $('#pomoSkip').hidden = T.phase === 'done' || T.phase === 'ready';
  $('#pomoBtns').classList.toggle('one', $('#pomoSkip').hidden);
  $('#pomoStop').hidden = T.phase === 'done';
  ov.hidden = !ui.pomoOpen;
  mini.hidden = !!ui.pomoOpen;
  mini.className = `pomo-mini ${T.phase}`;
  $('#pomoMiniT').textContent = T.phase === 'done' ? '✓' : T.phase === 'ready' ? '▶' : (paused ? '⏸ ' : '') + mmss;
  document.title = T.phase === 'done' || T.phase === 'ready' ? pomoPaint.title : `${T.phase === 'break' ? '☕' : '🍅'} ${mmss}`;
  keepAwake(running && !!ui.pomoOpen);
}
function pomoTick() {
  if (S.timer && S.timer.endsAt && Date.now() >= S.timer.endsAt) {
    if (document.hidden) pomoCatchUp();
    else { pomoAdvance(false); if (ui.tab === 'today') renderToday(); }
  }
  pomoPaint();
}
$('#pomo').addEventListener('click', e => { if (e.target.id === 'pomo') { ui.pomoOpen = false; pomoPaint(); } });
setInterval(pomoTick, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pomoCatchUp(); pomoPaint(); } });

document.addEventListener('click', async e => {

    case 'import': $('#importFile').click(); break;

  if (ui.tab === 'today' && !document.hidden) renderToday();
}
setInterval(refreshClock, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClock(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'more') renderMore(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('🎉 اتثبّت التطبيق'); });

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller)
            toast('🆕 فيه تحديث جديد', { label: 'حدّث', fn: () => nw.postMessage({ type: 'SKIP_WAITING' }) });
        });
      });
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloading) return; reloading = true; location.reload(); });
  });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

applyTheme();
pomoCatchUp();
ui.anim = true;
render();
pomoPaint();
animateIn($('#v-' + ui.tab));
window.__app = { get S() { return S; }, ui, dayStats, streaks, buildICS };   // للاختبار
})();

</script>
</body>
</html>
