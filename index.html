<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطتي — جدول الجامعة والإنتاجية</title>
<meta name="description" content="جدول يومي للجامعة والإنتاجية مع تتبّع الإنجاز وتحليلات ومتابعة النوم.">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خطتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<link rel="stylesheet" href="styles.css">
<script>
  /* apply saved theme before first paint (no flash) */
  try{var s=JSON.parse(localStorage.getItem('saif-plan-v1')||'{}');var t=s.settings&&s.settings.theme;
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="row">
      <div>
        <h1 id="hello">أهلاً 👋</h1>
        <p id="subdate"></p>
      </div>
      <div class="pill" id="streakPill">🔥 0</div>
    </div>
  </header>

  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-stats" hidden></section>
    <section class="view" id="v-sleep" hidden></section>
    <section class="view" id="v-more" hidden></section>
    <noscript><div class="card">لازم تفعّل JavaScript عشان التطبيق يشتغل.</div></noscript>
  </main>

  <nav class="tabbar" aria-label="التنقل">
    <div class="in">
      <button data-act="tab" data-tab="today" class="on" aria-label="اليوم">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>اليوم</button>
      <button data-act="tab" data-tab="stats" aria-label="التحليلات">
        <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>التحليلات</button>
      <button data-act="tab" data-tab="sleep" aria-label="النوم">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>النوم</button>
      <button data-act="tab" data-tab="more" aria-label="المزيد">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>المزيد</button>
    </div>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><div><span id="toastMsg"></span><button id="toastBtn" hidden></button></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="schedule.js"></script>
<script src="app.js"></script>
</body>
</html>
